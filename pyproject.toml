[project]
name = "norna-fishdraw"
version = "0.1.0"
description = "Procedural low-poly 3D fish as rigged, textured glTF: a Python fork of Lingdong Huang's fishdraw, grown for the game Norna."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Albin Ekblom" }]
keywords = ["procedural", "fish", "gltf", "glb", "low-poly", "generative", "fishdraw"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Games/Entertainment",
]
dependencies = []

[project.optional-dependencies]
images = ["pillow>=10"]

[project.urls]
Homepage = "https://github.com/albinekb/norna-fishdraw"
Upstream = "https://github.com/LingDong-/fishdraw"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["norna_fishdraw*"]

[tool.setuptools.package-data]
"norna_fishdraw.v2" = ["*.json"]
